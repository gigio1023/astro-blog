<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Geometric abstract: two overlapping circles forming an abstract "S" flow -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#000000" stroke-width="16"/>
  <circle cx="180" cy="180" r="70" fill="none" stroke="#000000" stroke-width="16"/>
  <!-- Diagonal connector -->
  <line x1="155" y1="85" x2="145" y2="215" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
</svg>
